name: MLOps PRO Pipeline

on:
  push:
    branches: ["master"]

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set PYTHONPATH
      run: echo "PYTHONPATH=." >> $GITHUB_ENV

    - name: Train model (MLflow)
      run: |
        python src/train.py

    - name: Upload MLflow artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mlruns
        path: mlruns/

    - name: Upload model bundle
      uses: actions/upload-artifact@v4
      with:
        name: model-bundle
        path: models/

  docker:
    needs: train
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Download model bundle
      uses: actions/download-artifact@v4
      with:
        name: model-bundle
        path: models/

    - name: Build Docker image
      run: |
        docker build -t churn-api .